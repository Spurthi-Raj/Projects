{% load static%}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/index.css'%}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Font Awesome 5 Brands:wght@400&display=swap" />
    <script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="signup-login">
      <div class="signup-box">
        <form action="" method="POST">
          {% csrf_token %}
          <div class="heading">Login</div>
          <div class="line"></div>
          <div class="field">
            <b>Username</b>
            <input type="text" required class="inp" placeholder="Enter Username" name="fnm"  />
          </div>
          
          <div class="field">
            <b>Password</b>
            <input type="password" required class="inp" placeholder="Enter your password" name="pwd"/>
          </div>
          <div class="field">
            <input type="submit" class="submit-button" value="login" />
          </div>
          <div class="field">
            <b>Don't Have an Account</b>
            <a class="anc" href="/signup">Signup</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
