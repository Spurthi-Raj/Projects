{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Blog</title>
    <link rel="stylesheet" href="{% static 'event/base.css' %}" />
  </head>

  <body>
    <!-- NAVBAR -->

    <div class="navbar">
      <a href="/" class="logo">Events</a>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/">Events</a>

        {% if user.is_authenticated %}

        <span style="color: white; margin-left: 15px">
          Hello, {{ user.username }}
        </span>

        <form method="POST" action="{% url 'logout' %}" style="display: inline">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>

        {% else %}

        <a href="">Login</a>
        <a href="">Register</a>

        {% endif %}
      </div>
    </div>
    <div>
      {% if messages %} 
        {% for message in messages %}
          <div class="alert alert-success">
            {{message}}
          </div>
        {% endfor %} 
      {% endif %}
    </div>

    {% block content %} {% endblock %}
  </body>
</html>
