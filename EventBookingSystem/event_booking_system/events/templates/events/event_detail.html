{% extends 'events/base.html' %} {% block content %}
<div class="container">
  <div class="post-card">
    <h1 class="post-title">{{ event.title }}</h1>

    <p class="post-meta">Created on {{ event.created_at }} ,  Created by : {{ event.created_by }}</p>

    <div class="post-content">{{ event.description }}</div>
    <p class="post-meta">Event Date :  {{ event.date }}</p>

    <br />


    <a href="{% url 'event_list' %}"> ← Back to Blog </a>
  </div>
</div>
{% endblock content %}
